<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>QR Generator – HoamatWerk</title>
  <link href="https://fonts.googleapis.com/css2?family=Niconne&family=Open+Sans:wght@400;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <script src="qrcode.min.js"></script>
</head>
<body>
  <div class="bg-texture"></div>
  <header>
    <span class="logo-brand">HoamatWerk</span>
    <span class="logo-sub">QR Generator</span>
  </header>
  <main>
    <div class="card">
      <label for="url-input">URL eingeben</label>
      <div class="input-row">
        <input type="url" id="url-input" placeholder="https://dein-Link.at/..." autocomplete="off" spellcheck="false" />
        <button id="generate-btn">Generieren</button>
      </div>
      <p class="hint">Funktioniert mit OneDrive, Links, Websites – alles was eine URL hat.</p>
    </div>
    <div class="card qr-card" id="qr-card" style="display:none;">
      <div class="qr-wrap" id="qr-wrap"></div>
      <div class="download-row">
        <button class="dl-btn" id="dl-png">⬇ PNG</button>
        <button class="dl-btn" id="dl-svg">⬇ SVG</button>
      </div>
      <p class="qr-url-label" id="qr-url-label"></p>
    </div>
  </main>
  <footer><span>Echt Hondg'mocht · HoamatWerk · <a href="impressum.html" style="color:inherit;text-decoration:none;opacity:0.7;">Impressum</a></span></footer>
  <script src="script.js"></script>
</body>
</html>
